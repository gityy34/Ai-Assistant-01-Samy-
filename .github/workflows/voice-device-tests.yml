name: Offline voice device tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-device-tests-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Enable emulator acceleration
        run: |
          sudo chmod 666 /dev/kvm
      - name: Prepare verified bundled voice resources
        shell: pwsh
        run: ./scripts/prepare-base-voices.ps1
      - name: Exercise native Urdu and English TTS
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb logcat -c
            mkdir -p verification
            gradle --no-daemon -PtestAbi=x86_64 connectedDebugAndroidTest || { adb logcat -d > verification/emulator-logcat.txt; exit 1; }
            adb logcat -d > verification/emulator-logcat.txt
            adb pull /sdcard/Download/voice-lab-review verification/ui-review
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system font_scale 1.6
            adb shell am start -W -n com.teamji.assistantmakingproject/.MainActivity
            sleep 3
            adb exec-out screencap -p > verification/ui-review/03-large-font.png
            adb shell cmd uimode night yes
            adb shell am start -W -n com.teamji.assistantmakingproject/.MainActivity
            sleep 3
            adb exec-out screencap -p > verification/ui-review/04-dark-large-font.png
      - name: Collect native crash diagnostics
        if: always()
        run: |
          mkdir -p verification
          timeout 10s adb logcat -d > verification/post-emulator-logcat.txt || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Voice-device-test-reports
          path: |
            verification/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
