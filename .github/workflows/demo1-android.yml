name: Demo 1 Android build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: demo1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'Android SDK missing from runner' }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'
          if ($LASTEXITCODE -ne 0) { throw 'SDK installation failed' }
      - name: Run unit tests and build debug APK
        shell: pwsh
        run: ./scripts/build-demo1.ps1
      - name: Upload shell APK
        uses: actions/upload-artifact@v7
        with:
          name: Demo1-shell-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Demo1-verification
          path: |
            verification/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14
